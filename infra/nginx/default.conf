# DRAFT. Routing from proposal 0001: /api/ and /admin/ to Django, /static/ from disk, the rest to the
# Next.js storefront. Cloudflare terminates the public connection and re-connects to this server
# with its origin certificate (SSL mode "Full (strict)").

upstream backend_app {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Real client address. The generated file lists Cloudflare's own addresses, so the
    # CF-Connecting-IP header is believed only when the request really came from Cloudflare.
    # Created by infra/nginx/update-cloudflare-ips.sh. No file means nothing is trusted.
    include /etc/nginx/cloudflare/*.conf;

    # Photos go straight to object storage through presigned uploads, so bodies stay small.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    # Django only ever sees an address nginx has checked: a client cannot forge this header.
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;

    location /api/ {
        proxy_pass http://backend_app;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://backend_app;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /srv/static/;
        expires 1h;
    }

    # The storefront is resolved when a request arrives, not at start-up, so nginx still boots
    # while the storefront is not running yet.
    location / {
        resolver 127.0.0.11 valid=10s;
        set $storefront http://storefront:3000;
        proxy_pass $storefront;
    }

    # Add HSTS (Strict-Transport-Security) only after HTTPS has been proven on this domain.
}
