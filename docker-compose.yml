# Local development only. The production server needs a dependency proposal first. 
services: 
  db: 
    image: postgres:16 
    environment: 
      POSTGRES_DB: ${POSTGRES_DB} 
      POSTGRES_USER: ${POSTGRES_USER} 
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
    volumes: 
      - pgdata:/var/lib/postgresql/data 
  redis: 
    image: redis:7 
  web: 
    build: 
      context: . 
      dockerfile: infra/Dockerfile.backend 
    command: python manage.py runserver 0.0.0.0:8000 
    env_file: .env 
    ports: 
      - "8000:8000" 
    depends_on: [db, redis] 
  worker: 
    build: 
      context: . 
      dockerfile: infra/Dockerfile.backend 
    command: celery -A config worker -l info 
    env_file: .env 
    depends_on: [db, redis] 
  beat: 
    build: 
      context: . 
      dockerfile: infra/Dockerfile.backend 
    command: celery -A config beat -l info 
    env_file: .env 
    depends_on: [db, redis] 
volumes: 
  pgdata: 
