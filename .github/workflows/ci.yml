name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: skclothing
      POSTGRES_USER: sk
      POSTGRES_PASSWORD: ci-only-throwaway
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: skclothing
          POSTGRES_USER: sk
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: mypy .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
