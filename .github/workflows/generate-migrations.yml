name: Generate migrations

# Django migrations must match Django's own output exactly, and they cannot be run on a
# developer's machine here. Add [gen-migrations] to a commit message and push: this job runs
# `makemigrations` and commits whatever it creates back to the same branch. Commits made with the
# built-in token do not start other workflows, so push an empty commit afterwards to run CI.

on:
  push:
    branches-ignore: [main]

permissions:
  contents: write

jobs:
  generate:
    if: contains(github.event.head_commit.message, '[gen-migrations]')
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: skclothing
      POSTGRES_USER: sk
      POSTGRES_PASSWORD: ci-only-throwaway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements/dev.txt
      - name: Run makemigrations
        working-directory: backend
        run: python manage.py makemigrations --verbosity 2
      - name: Commit any new migrations
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Generate migrations"
            git push
          else
            echo "No migration changes were needed."
          fi
